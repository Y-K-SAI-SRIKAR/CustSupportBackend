# ===============================
# APPLICATION NAME & SERVER
# ===============================
spring.application.name=CustomerSupportBackend
server.port=${PORT:8080}

# ===============================
# DATASOURCE (Requires local Env Vars or IDE Run Config for local dev)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JACKSON DATE/TIME
# ===============================
spring.jackson.time-zone=UTC

# ===============================
# GMAIL API SERVICE ACCOUNT CONFIGURATION
# ===============================
# Set this environment variable locally and on Render:
# ===============================
# GMAIL API OAUTH2 CONFIGURATION
# ===============================
google.oauth2.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
google.oauth2.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
google.oauth2.refresh-token=${GOOGLE_OAUTH2_REFRESH_TOKEN}
gmail.sender-email=ksaisrikaryerraguntla9@gmail.com

# ===============================
# FRONTEND CONFIGURATION
# ===============================
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL}

# ===============================
# MICROSERVICES / AGENT CONFIGURATION
# ===============================
# Configure for the ADK agent endpoint
app.agent.base-url=${APP_AGENT_BASE_URL}

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO
logging.level.com.customersupport=DEBUG